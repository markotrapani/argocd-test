{{- $recname := index .Values "redis-enterprise-cluster" "recname" }}
{{- $expectedVersion := index .Values "redis-enterprise-cluster" "versionTag" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: wait-for-rec-ready-{{ .Release.Revision }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "15"
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  template:
    spec:
      serviceAccountName: wait-for-rec-sa
      restartPolicy: Never
      containers:
        - name: wait-for-rec
          image: bitnami/kubectl:latest
          command:
            - /bin/bash
            - -c
            - |
              #!/bin/bash

              # Handle SIGTERM gracefully
              trap "echo 'Received SIGTERM, exiting'; exit 0" SIGTERM SIGINT

              REC_NAME="{{ $recname }}"
              EXPECTED_VERSION="{{ $expectedVersion }}"
              NAMESPACE="{{ .Release.Namespace }}"

              echo "Waiting for REC $REC_NAME to be Running with version $EXPECTED_VERSION..."

              # Give operator time to start processing the spec change
              echo "Initial wait (15s) to allow operator to detect spec changes..."
              sleep 15

              while true; do
                STATE=$(kubectl get rec "$REC_NAME" -n "$NAMESPACE" -o jsonpath='{.status.state}' 2>/dev/null)
                SPEC_STATUS=$(kubectl get rec "$REC_NAME" -n "$NAMESPACE" -o jsonpath='{.status.specStatus}' 2>/dev/null)

                # Get actual pod images - this is the source of truth for upgrade completion
                # Only check node pods (redis.io/role=node), not services-rigger
                POD_COUNT=$(kubectl get pods -n "$NAMESPACE" -l "redis.io/cluster=$REC_NAME,redis.io/role=node" --no-headers 2>/dev/null | wc -l | tr -d ' ')

                # Get unique image versions from REC node pods
                POD_VERSIONS=$(kubectl get pods -n "$NAMESPACE" -l "redis.io/cluster=$REC_NAME,redis.io/role=node" \
                  -o jsonpath='{range .items[*]}{.spec.containers[?(@.name=="redis-enterprise-node")].image}{"\n"}{end}' 2>/dev/null | \
                  grep -oE '[0-9]+\.[0-9]+\.[0-9]+-[0-9]+' | sort -u)

                # Count how many node pods have the expected version
                PODS_WITH_EXPECTED=$(kubectl get pods -n "$NAMESPACE" -l "redis.io/cluster=$REC_NAME,redis.io/role=node" \
                  -o jsonpath='{range .items[*]}{.spec.containers[?(@.name=="redis-enterprise-node")].image}{"\n"}{end}' 2>/dev/null | \
                  grep -c "$EXPECTED_VERSION" || echo "0")

                echo "$(date): REC state: $STATE, specStatus: $SPEC_STATUS"
                echo "  Pods: $POD_COUNT total, $PODS_WITH_EXPECTED with expected version $EXPECTED_VERSION"
                echo "  Pod versions found: $(echo $POD_VERSIONS | tr '\n' ' ')"

                # Check ALL conditions:
                # 1. REC is Running
                # 2. specStatus is Valid
                # 3. ALL pods have the expected version (not just spec)
                if [[ "$STATE" == "Running" && "$SPEC_STATUS" == "Valid" && "$POD_COUNT" -gt 0 && "$PODS_WITH_EXPECTED" -eq "$POD_COUNT" ]]; then
                  echo "REC is ready! All $POD_COUNT pods running version $EXPECTED_VERSION."
                  echo "Proceeding with database deployments..."
                  exit 0
                fi

                echo "REC not ready yet, waiting 30 seconds..."
                sleep 30 &
                wait $!
              done