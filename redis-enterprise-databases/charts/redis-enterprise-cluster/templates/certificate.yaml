{{- if .Values.global.enableCertManager }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Values.recname }}-cert
spec:
  secretName: redis-proxy-cert-gen

  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048

  duration: 8760h # 365d
  renewBefore: 720h # 30d

  isCA: false
  usages:
    - server auth
    - client auth

  subject:
    organizations:
      - Avaya
    organizationalUnits:
      - AXP 
    countries:
      - US

  commonName: axp-redis.infra.svc.cluster.local

  dnsNames:
    - "axp-redis.infra.svc.cluster.local"
    - "*.axp-redis.infra.svc.cluster.local"
    - "internal.axp-redis.infra.svc.cluster.local"
    - "*.internal.axp-redis.infra.svc.cluster.local"
    - "redis-*.infra.svc.cluster.local"
    - "*.redis-*.infra.svc.cluster.local"
    - "redis-replicated.infra.svc.cluster.local"
    - "redis-persisted.infra.svc.cluster.local"
    - "redis-searchable.infra.svc.cluster.local"
    - "redis-nonreplicated.infra.svc.cluster.local"
    
    
    

  issuerRef:
    name: ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
{{- end }}
