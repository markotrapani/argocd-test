# Values for LOCAL TESTING - Initial deployment
# Disables cert-manager and external-secrets dependencies
global:
  enableExternalSecrets: false
  enableCertManager: false
  zoneAwareness: false
  image:
    repoUrl: bitnami

redis-enterprise-operator:
  versionTag: "7.4.2-12"
  affinity: ""  # Disable node affinity for local testing

redis-enterprise-cluster:
  recname: test-redis
  nodes: 3
  licenseSecretName: ""
  versionTag: "7.4.2-169"
  redisEnterpriseImageSpec: redislabs/redis
  redisEnterpriseServicesRiggerImageSpec: redislabs/k8s-controller
  bootstrapperImageSpec: redislabs/operator
  enablePersistence: false
  volumeSize: "10Gi"
  disallowEviction: false
  requests:
    cpu: "500m"
    memory: "4Gi"
  limits:
    memory: "4Gi"
  nodeSelector: {}

redis-replicated:
  enabled: true
  name: redis-replicated
  redisVersion: "7.2"
  memorySize: 100MB
  databasePort: 13001
  shardCount: 1
  replication: true
  persistence: disabled
  tlsMode: disabled

redis-nonreplicated:
  enabled: false
redis-persisted:
  enabled: false
redis-searchable:
  enabled: false
redis-enterprise-recovery:
  enabled: false